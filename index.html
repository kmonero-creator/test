<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c8102e" />
  <title>Hearts of Nepal</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>❤️ Hearts of Nepal 🇳🇵</h1>
      <button id="installBtn" class="install-btn" hidden>Install App</button>
    </header>

    <section class="hud" aria-label="Game information">
      <p>Score: <span id="score">0</span></p>
      <p>Time: <span id="time">45</span>s</p>
      <button id="restartBtn" class="restart-btn">Restart</button>
    </section>

    <canvas id="gameCanvas" width="420" height="640" aria-label="Game canvas"></canvas>

    <section class="instructions">
      <h2>How to play</h2>
      <ul>
        <li>Move with ← → keys, A/D, or swipe on mobile.</li>
        <li>Catch red hearts for +10 points.</li>
        <li>Avoid broken hearts (-8 points).</li>
        <li>Score as high as possible before time runs out.</li>
      </ul>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
